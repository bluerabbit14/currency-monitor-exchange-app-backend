spring.application.name=currency
spring.profiles.default=dev

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mvc.problemdetails.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.otp.ttl-seconds=300
app.otp.max-attempts=5
app.otp.pepper=${OTP_PEPPER}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-seconds=900
app.jwt.refresh-ttl-seconds=2592000
app.resend.api-key=${RESEND_API_KEY}
app.resend.from=${RESEND_FROM:}
app.resend.base-url=https://api.resend.com
