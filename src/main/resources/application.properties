spring.application.name=currency
spring.profiles.default=dev

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.otp.ttl-seconds=300
app.otp.max-attempts=5
app.otp.pepper=${OTP_PEPPER}
# Redis holds OTP challenges and the sign-up profile until the OTP is verified. Use rediss:// for TLS.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
# Fail fast so a dead Redis cannot hang requests or the health check.
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-seconds=900
app.jwt.refresh-ttl-seconds=2592000
app.resend.api-key=${RESEND_API_KEY}
app.resend.from=${RESEND_FROM:}
app.resend.base-url=https://api.resend.com

# Maximum age of observedAt before a cached rate is marked stale.
# Review production thresholds after a rate provider is selected.
app.rates.stale-after=PT15M

# Account deletion: a profile stays recoverable (sign in to cancel) for this many days, then the worker erases it.
app.deletion.grace-period-days=15
app.deletion.poll-interval-ms=60000
app.deletion.batch-size=20
