spring.application.name=currency
spring.profiles.default=dev

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.otp.ttl-seconds=300
app.otp.max-attempts=5
app.otp.pepper=${OTP_PEPPER}
# Redis holds OTP challenges and the sign-up profile until the OTP is verified. Use rediss:// for TLS.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
# Fail fast so a dead Redis cannot hang requests or the health check.
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-seconds=900
app.jwt.refresh-ttl-seconds=2592000
app.resend.api-key=${RESEND_API_KEY}
app.resend.from=${RESEND_FROM:}
app.resend.base-url=https://api.resend.com
# Admin endpoints stay closed (403) until a key is set; clients send it in X-Admin-Key.
app.admin.api-key=${ADMIN_API_KEY:}

# Maximum age of observedAt before a cached rate is marked stale.
# Review production thresholds after a rate provider is selected.
app.rates.stale-after=PT15M

# Account deletion: a profile stays recoverable (sign in to cancel) for this many days, then the worker erases it.
app.deletion.grace-period-days=15
app.deletion.poll-interval-ms=60000
app.deletion.batch-size=20

# Rate collection (Twelve Data). Off by default; set RATES_COLLECTION_ENABLED=true and TWELVEDATA_API_KEY to run.
# Interval = delay between runs. 6 Twelve Data pairs every 12 min is about 720 credits/day (free plan: 800/day, 8/min).
app.rates.collection.enabled=${RATES_COLLECTION_ENABLED:false}
app.rates.collection.interval=PT12M
app.rates.collection.initial-delay=PT30S
app.rates.twelvedata.api-key=${TWELVEDATA_API_KEY:}
app.rates.twelvedata.base-url=https://api.twelvedata.com
app.rates.twelvedata.connect-timeout=3s
app.rates.twelvedata.read-timeout=10s
app.rates.twelvedata.requests-per-minute=6
app.rates.twelvedata.daily-request-limit=750
app.rates.twelvedata.rate-limit-backoff=PT2M

# Rate collection (CoinGecko, crypto). Separate from the Twelve Data scheduler above. Off by default; needs
# COINGECKO_COLLECTION_ENABLED=true and COINGECKO_API_KEY. One batched /simple/price request per run:
# every 5 min is about 8,640 requests per 30 days (Demo plan: 10,000/month, shared with any other use of the key).
# Pro keys: set base-url=https://pro-api.coingecko.com/api/v3 and api-key-header=x-cg-pro-api-key.
app.rates.coingecko.enabled=${COINGECKO_COLLECTION_ENABLED:false}
app.rates.coingecko.interval=PT5M
app.rates.coingecko.initial-delay=PT45S
app.rates.coingecko.api-key=${COINGECKO_API_KEY:}
app.rates.coingecko.api-key-header=x-cg-demo-api-key
app.rates.coingecko.base-url=https://api.coingecko.com/api/v3
app.rates.coingecko.connect-timeout=3s
app.rates.coingecko.read-timeout=10s
app.rates.coingecko.monthly-request-limit=9000
app.rates.coingecko.rate-limit-backoff=PT15M

# Rate collection (Gold API, commodities). Separate from the Twelve Data and CoinGecko schedulers. Off by default;
# set GOLDAPI_COLLECTION_ENABLED=true to run; GOLDAPI_API_KEY (optional) is sent as x-api-key. One request per commodity
# (XAU, XAG, XPT, XPD), at most 10 requests in any rolling hour (the plan limit), rotating through the commodities. Copper (HG) was removed in V20: the
# Gold API does not state its unit.
app.rates.goldapi.enabled=${GOLDAPI_COLLECTION_ENABLED:false}
app.rates.goldapi.interval=PT10M
app.rates.goldapi.initial-delay=PT60S
app.rates.goldapi.base-url=https://api.gold-api.com
app.rates.goldapi.connect-timeout=3s
app.rates.goldapi.read-timeout=10s
app.rates.goldapi.requests-per-minute=6
app.rates.goldapi.requests-per-hour=10
app.rates.goldapi.api-key=${GOLDAPI_API_KEY:}
app.rates.goldapi.rate-limit-backoff=PT2M

# Sign in with Google (OIDC). The Web client ID that Google ID tokens must be issued for (the "aud" claim).
# Google sign-in answers 503 until it is set.
app.oidc.google.client-id=${GOOGLE_WEB_CLIENT_ID:}
